services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: lagan
      POSTGRES_PASSWORD: lagan
      POSTGRES_DB: lagan
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 stores data under /var/lib/postgresql/<major>/docker and
      # refuses to boot when a volume is mounted at the old /var/lib/postgresql/data path.
      - pgdata:/var/lib/postgresql
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lagan
      MINIO_ROOT_PASSWORD: laganminio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
volumes:
  pgdata:
  miniodata:
