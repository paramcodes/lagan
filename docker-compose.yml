services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: lagan
      POSTGRES_PASSWORD: lagan
      POSTGRES_DB: lagan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lagan
      MINIO_ROOT_PASSWORD: laganminio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
volumes:
  pgdata:
  miniodata:
