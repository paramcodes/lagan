id: commit-size-guard
title: A commit stays under 5000 tokens of diff.
layer: lint
enforced_by:
  - path: lefthook.yml
    match: size-guard
artifact:
  - path: lefthook.yml
    note: The pre-commit guard that rejects an oversized commit.
failure: |
  2026-10-20. No oversized commit has landed. The lefthook size-guard enforces the rule, and
  the rule exists so the guard is not deleted later as redundant prose.
owner: "@paramcodes"
protects:
  - path: lefthook.yml
    protection: The size guard is the mechanism behind the commit size rule.
