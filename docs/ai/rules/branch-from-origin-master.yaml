id: branch-from-origin-master
title: A branch is cut from origin/master, never from a stale local master.
layer: prose
artifact:
  - path: pr:comment
    note: The pull request records the base commit the branch was cut from.
failure: |
  2026-10-20. A branch cut from a stale local master diverged from the remote and had to be
  reconciled by hand before it could be merged.
