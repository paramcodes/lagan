id: budget-the-machine
title: Keep three subagents in flight, and run one heavy gate at a time.
layer: prose
artifact:
  - path: pr:comment
    note: The coordinator states which heavy gate is running.
failure: |
  2026-10-20. On this four-core box, three agents running the full test suite and a
  production build at the same time pushed the load average to 25, and a 48 minute critical
  path spent 30 minutes of it waiting. The rule now also says that at most one heavy gate
  runs at a time, and that worktrees and dependency installs are prepared before dispatch.
owner: "@paramcodes"
protects:
  - path: package.json
    protection: The full-suite command is one heavy gate, and two of them at once is the oversubscription.
